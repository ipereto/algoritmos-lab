name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compilar y correr los labs 00 a 08
        run: ./run.sh all
      - name: Correr el verificador de retos (los pendientes no fallan el build)
        run: ./run.sh retos
